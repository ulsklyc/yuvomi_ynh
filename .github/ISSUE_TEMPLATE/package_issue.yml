name: Package problem
description: Install, upgrade, backup, restore, change_url or remove fails on YunoHost.
labels: ["bug"]
body:
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - install
        - upgrade
        - backup
        - restore
        - change_url
        - remove
        - other
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      description: "`yunohost app info yuvomi`, e.g. 2.85.0~ynh1. When upgrading, the version you came from too."
    validations:
      required: true
  - type: input
    id: yunohost_version
    attributes:
      label: YunoHost version
      description: "`yunohost --version`"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: The command you ran (or its CLI equivalent if you used the webadmin), what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Log
      description: "The link from `yunohost log share <log-id>` (find the id with `yunohost log list`), or from Share with Yunopaste in the webadmin."
      placeholder: https://paste.yunohost.org/...
    validations:
      required: true
